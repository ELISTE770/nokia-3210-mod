# ====================================================================
# Nokia 3210 4G (UMS9117) - J2ME (MIDP 2.0 / CLDC 1.1) Runtime Config
# ====================================================================

[display]
width=240
height=320
bpp=16
fps_limit=30
color_format=RGB565
rotate=0

[vm]
heap_size_mb=8
stack_size_kb=64
jit_enabled=1
rms_root_path=/nokia/data/rms

[keypad]
# Direct mapping to Nokia 3210 4G D-Pad and T9 Keys
key_up=0x04
key_down=0x05
key_left=0x06
key_right=0x07
key_fire=0x0D
key_soft1=0x01
key_soft2=0x02
key_num0=0x30
key_num1=0x31
key_num2=0x32
key_num3=0x33
key_num4=0x34
key_num5=0x35
key_num6=0x36
key_num7=0x37
key_num8=0x38
key_num9=0x39
key_star=0x2A
key_hash=0x23

[audio]
midi_enabled=1
wav_enabled=1
master_volume=80
